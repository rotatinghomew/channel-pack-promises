[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exchange-commitment-backend"
version = "1.0.0"
description = "Exact multi-channel product specification, publication and order commitment backend"
requires-python = ">=3.11"

[project.scripts]
exchange-backend = "exchange.__main__:main"

[tool.setuptools]
packages = ["exchange"]
